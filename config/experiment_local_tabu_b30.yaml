dataset:
  train_csv: "dataset/UNSW_NB15_training-set.csv"
  test_csv:  "dataset/UNSW_NB15_testing-set.csv"
  target: "label"
  drop_cols: ["id", "attack_cat"]

task:
  type: "binary"
  positive_label: 1
  negative_label: 0

protocol:
  val_size: 0.2

preprocess:
  categorical_cols: ["proto", "service", "state"]
  numeric_impute: "median"
  onehot_handle_unknown: "ignore"

selection:
  mode: "grouped_original_features"
  k_min: 8

fitness:
  alpha_fpr: 0.05
  lambda_fpr: 20.0
  lambda_feat: 0.2
  metric_primary: "recall"

budget:
  evaluations_B: 30
  seeds: [0]

run:
  enabled_algorithms: ["tabu"]

model:
  name: "random_forest"
  fixed:
    n_jobs: 1
    random_state_from_seed: true
  search_space:
    n_estimators: [100, 300]
    max_depth: [6, 20]
    min_samples_split: [2, 20]
    min_samples_leaf: [1, 8]
    max_features: ["sqrt", "log2"]
    class_weight: [null, "balanced"]

optimizers:
  tabu:
    tabu_tenure: 5
    neighborhood_size: 3
    feature_flips: [1, 2]
    param_step_scale: 0.10

output:
  results_dir: "results/tabu/b30_seed0"
  save_raw_per_seed: true
  save_plots: true
